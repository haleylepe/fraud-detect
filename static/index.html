<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fraud Review Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f7f8fa;
      --surface:   #ffffff;
      --border:    #e4e7ec;
      --border-2:  #d0d5dd;
      --text-1:    #101828;
      --text-2:    #475467;
      --text-3:    #98a2b3;
      --blue:      #2563eb;
      --blue-light:#eff4ff;
      --blue-mid:  #c7d7fe;
      --green:     #16a34a;
      --green-light:#f0fdf4;
      --green-mid: #bbf7d0;
      --red:       #dc2626;
      --red-light: #fef2f2;
      --red-mid:   #fecaca;
      --radius:    10px;
      --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
    }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      padding: 0;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      color: var(--text-1);
      letter-spacing: -.2px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 16px; height: 16px; }
    .header-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: .4px;
    }

    /* ── Layout ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.4px;
      margin-bottom: 4px;
    }
    .page-sub {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
    }

    /* ── Input card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }
    .card-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      min-height: 130px;
      border: 1px solid var(--border-2);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: var(--text-1);
      resize: vertical;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: var(--bg);
    }
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: var(--surface);
    }
    textarea::placeholder { color: var(--text-3); }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }
    #charCount {
      font-size: 12px;
      color: var(--text-3);
      font-family: 'IBM Plex Mono', monospace;
    }

    button {
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .15s, transform .1s, opacity .15s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    button.loading .spinner { display: block; }
    button.loading .btn-text { opacity: .7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ── */
    #results {
      display: none;
      animation: fadeUp .3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Verdict banner */
    .verdict-banner {
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }
    .verdict-banner.flagged {
      background: var(--red-light);
      border-color: var(--red-mid);
    }
    .verdict-banner.clean {
      background: var(--green-light);
      border-color: var(--green-mid);
    }
    .verdict-dot {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }
    .flagged .verdict-dot { background: var(--red-mid); }
    .clean   .verdict-dot { background: var(--green-mid); }
    .verdict-label {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.3px;
    }
    .flagged .verdict-label { color: var(--red); }
    .clean   .verdict-label { color: var(--green); }
    .verdict-preview {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 2px;
      font-style: italic;
    }

    /* Three-column grid for scores + rules + explanation */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .results-grid .span-2 {
      grid-column: 1 / -1;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-3);
      margin-bottom: 16px;
    }

    /* Detoxify scores */
    .score-row {
      margin-bottom: 11px;
    }
    .score-row:last-child { margin-bottom: 0; }
    .score-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .score-name {
      font-size: 13px;
      color: var(--text-2);
      text-transform: capitalize;
      font-weight: 400;
    }
    .score-name.primary { font-weight: 500; color: var(--text-1); }
    .score-val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text-2);
    }
    .score-val.high { color: var(--red); font-weight: 500; }
    .score-bar-track {
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--blue);
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }
    .score-bar-fill.high { background: var(--red); }
    .score-bar-fill.mid  { background: #f59e0b; }

    /* Triggered rules */
    .rules-empty {
      font-size: 13px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
    }
    .rule-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--bg);
    }
    .rule-item:last-child { margin-bottom: 0; }
    .rule-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--red);
      background: var(--red-light);
      border: 1px solid var(--red-mid);
      border-radius: 4px;
      padding: 2px 7px;
      display: inline-block;
      margin-bottom: 5px;
    }
    .rule-detail {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.5;
    }

    /* Explanation */
    .explanation-box {
      background: var(--blue-light);
      border: 1px solid var(--blue-mid);
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-1);
    }
    .explanation-box .attr {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }
    .explanation-box .attr-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    /* Error state */
    .error-box {
      background: var(--red-light);
      border: 1px solid var(--red-mid);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--red);
      display: none;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .results-grid { grid-template-columns: 1fr; }
      .results-grid .span-2 { grid-column: 1; }
      header { padding: 0 16px; }
      .container { padding: 24px 16px 60px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 1.5L13.5 4.5V11.5L8 14.5L2.5 11.5V4.5L8 1.5Z" stroke="white" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M8 5.5V8.5M8 10V10.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    Fraud Review Dashboard
  </div>
  <span class="header-tag">CS 153 · Stanford</span>
</header>

<div class="container">
  <div class="page-title">Content Analyzer</div>
  <div class="page-sub">Paste a review, message, or transaction note to run it through the detection pipeline.</div>

  <div class="card">
    <div class="card-label">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="2" width="12" height="10" rx="2" stroke="#667085" stroke-width="1.3"/><path d="M4 5h6M4 7.5h4" stroke="#667085" stroke-width="1.3" stroke-linecap="round"/></svg>
      Input Text
    </div>
    <textarea id="inputText" placeholder="e.g. 'THIS IS A FAKE PRODUCT click here for refund wire transfer...'"></textarea>
    <div class="input-footer">
      <span id="charCount">0 / 10,000</span>
      <button id="analyzeBtn" onclick="analyze()">
        <div class="spinner"></div>
        <span class="btn-text">Analyze</span>
      </button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div id="results">
    <div class="verdict-banner" id="verdictBanner">
      <div class="verdict-dot" id="verdictDot"></div>
      <div>
        <div class="verdict-label" id="verdictLabel"></div>
        <div class="verdict-preview" id="verdictPreview"></div>
      </div>
    </div>

    <div class="results-grid">
      <!-- Detoxify Scores -->
      <div class="card">
        <div class="card-title">Detoxify Scores</div>
        <div id="scoresContainer"></div>
      </div>

      <!-- Triggered Rules -->
      <div class="card">
        <div class="card-title">Signal Rules</div>
        <div id="rulesContainer"></div>
      </div>

      <!-- LLM Explanation — full width -->
      <div class="card span-2">
        <div class="card-title">Analyst Explanation</div>
        <div class="explanation-box">
          <div class="attr"><div class="attr-dot"></div>Generated by Claude</div>
          <div id="explanationText"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const textarea = document.getElementById('inputText');
  const charCount = document.getElementById('charCount');

  textarea.addEventListener('input', () => {
    const n = textarea.value.length;
    charCount.textContent = `${n.toLocaleString()} / 10,000`;
    charCount.style.color = n > 9000 ? 'var(--red)' : 'var(--text-3)';
  });

  async function analyze() {
    const text = textarea.value.trim();
    if (!text) { flashError('Please enter some text to analyze.'); return; }

    const btn = document.getElementById('analyzeBtn');
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');

    btn.disabled = true;
    btn.classList.add('loading');
    errorBox.style.display = 'none';
    results.style.display = 'none';

    try {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const data = await res.json();
      renderResults(data);

    } catch (err) {
      flashError(err.message || 'Something went wrong. Is the server running?');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function renderResults(data) {
    // Verdict banner
    const banner = document.getElementById('verdictBanner');
    const dot    = document.getElementById('verdictDot');
    const label  = document.getElementById('verdictLabel');
    const preview = document.getElementById('verdictPreview');

    const flagged = data.verdict === 'FLAGGED';
    banner.className = `verdict-banner ${flagged ? 'flagged' : 'clean'}`;
    dot.textContent  = flagged ? '⚠' : '✓';
    label.textContent = data.verdict;
    preview.textContent = `"${data.text_preview}"`;

    // Detoxify scores
    const scoresEl = document.getElementById('scoresContainer');
    scoresEl.innerHTML = '';
    const scoreOrder = ['toxicity','severe_toxicity','obscene','threat','insult','identity_attack'];
    scoreOrder.forEach((key, i) => {
      const val = data.detoxify_scores[key] ?? 0;
      const pct = (val * 100).toFixed(1);
      const isHigh = val > 0.5;
      const isMid  = val > 0.2 && !isHigh;
      const isPrimary = i === 0;

      scoresEl.innerHTML += `
        <div class="score-row">
          <div class="score-meta">
            <span class="score-name ${isPrimary ? 'primary' : ''}">${key.replace(/_/g, ' ')}</span>
            <span class="score-val ${isHigh ? 'high' : ''}">${pct}%</span>
          </div>
          <div class="score-bar-track">
            <div class="score-bar-fill ${isHigh ? 'high' : isMid ? 'mid' : ''}"
                 style="width: 0%"
                 data-target="${pct}"></div>
          </div>
        </div>`;
    });

    // Animate bars after paint
    requestAnimationFrame(() => {
      document.querySelectorAll('.score-bar-fill').forEach(bar => {
        bar.style.width = bar.dataset.target + '%';
      });
    });

    // Triggered rules
    const rulesEl = document.getElementById('rulesContainer');
    rulesEl.innerHTML = '';
    if (data.triggered_rules.length === 0) {
      rulesEl.innerHTML = '<div class="rules-empty">✓ No rules triggered</div>';
    } else {
      data.triggered_rules.forEach(r => {
        rulesEl.innerHTML += `
          <div class="rule-item">
            <div class="rule-name">${r.rule}</div>
            <div class="rule-detail">${r.detail}</div>
          </div>`;
      });
    }

    // Explanation
    document.getElementById('explanationText').textContent = data.explanation;

    // Show results
    const resultsEl = document.getElementById('results');
    resultsEl.style.display = 'block';
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function flashError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
  }

  // Allow Cmd+Enter / Ctrl+Enter to submit
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) analyze();
  });
</script>
</body>
</html>
